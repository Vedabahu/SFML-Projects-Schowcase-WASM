<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Vedabahu's Random SFML Graphics - 1</title>

        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: black;
                font-family: Arial, sans-serif;

                display: flex;
                justify-content: center;
                align-items: center;
            }

            #container {
                position: relative;
                width: min(100vw, 100vh);
                height: min(100vw, 100vh);

                max-width: 1024px;
                max-height: 1024px;

                aspect-ratio: 1 / 1;
            }

            #canvas {
                width: 100%;
                height: 100%;
                display: block;
                background: black;
            }

            #status {
                position: absolute;
                top: 10px;
                left: 10px;
                color: white;
                background: rgba(0, 0, 0, 0.7);
                padding: 8px 12px;
                border-radius: 6px;
                font-size: 14px;
                z-index: 10;
            }
        </style>
    </head>

    <body>
        <div id="container">
            <div id="status">Downloading...</div>
            <canvas
                id="canvas"
                width="1024"
                height="1024"
                tabindex="-1"
            ></canvas>
        </div>

        <script>
            const statusElement = document.getElementById("status");
            const canvasElement = document.getElementById("canvas");

            function setStatus(text) {
                statusElement.textContent = text;

                if (text === "") {
                    statusElement.style.display = "none";
                }
            }

            canvasElement.addEventListener(
                "webglcontextlost",
                (e) => {
                    alert("WebGL context lost. Reload the page.");
                    e.preventDefault();
                },
                false,
            );

            var Module = {
                canvas: canvasElement,

                setStatus: setStatus,

                totalDependencies: 0,

                monitorRunDependencies(left) {
                    this.totalDependencies = Math.max(
                        this.totalDependencies,
                        left,
                    );

                    if (left) {
                        setStatus(
                            `Loading... (${this.totalDependencies - left}/${this.totalDependencies})`,
                        );
                    } else {
                        setStatus("");
                    }
                },
            };

            setStatus("Downloading...");

            window.onerror = function () {
                setStatus("Exception thrown, see JavaScript console");
            };
        </script>

        <script async src="./main.js"></script>
    </body>
</html>
